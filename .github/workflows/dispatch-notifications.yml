name: dispatch transaction notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-notification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch pending notifications
        env:
          NOTIFICATION_APP_URL: ${{ secrets.NOTIFICATION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$NOTIFICATION_APP_URL" ]; then
            echo "::error::Set the NOTIFICATION_APP_URL GitHub Actions secret."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET GitHub Actions secret."
            exit 1
          fi
          case "$NOTIFICATION_APP_URL" in
            https://*) ;;
            *)
              echo "::error::NOTIFICATION_APP_URL must use HTTPS."
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 540 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${NOTIFICATION_APP_URL%/}/api/resort/notification-dispatch"
